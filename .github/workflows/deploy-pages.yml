name: Deploy Indian Anime Club to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Refresh shared article assets and build clean routes
        shell: bash
        run: |
          # Cache-bust shared assets on every deploy so browsers cannot keep an
          # older article shell after the canonical header/footer is updated.
          # Keep shared assets fresh on every deploy.
          sed -i -E "s#site-shell\.css\?v=[^\"']+#site-shell.css?v=${GITHUB_SHA}#g" site-shell.js
          find . -type f -name '*.html' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            sed -i -E \
              -e "s#href=\"[^\"]*css/article\.css[^\"]*\"#href=\"/css/article.css?v=${GITHUB_SHA}\"#g" \
              -e "s#article-enhancements\.js\?v=[^\"']+#article-enhancements.js?v=${GITHUB_SHA}#g" \
              -e "s#site-shell\.js\?v=[^\"']+#site-shell.js?v=${GITHUB_SHA}#g" \
              "$file"
            # Every route gets the same canonical homepage header and footer.
            if ! grep -q 'src="/site-shell.js' "$file"; then
              sed -i "s#</body>#<script src=\"/site-shell.js?v=${GITHUB_SHA}\" defer></script></body>#I" "$file"
            fi
          done
          # Remove the homepage-style news ticker from every article source page.
          # Do this at build time so it cannot reappear due to delayed JavaScript or CSS.
          python3 - <<'PY'
          from pathlib import Path
          import re
          for page in Path("articles").glob("*.html"):
              if page.name == "index.html":
                  continue
              html = page.read_text(encoding="utf-8")
              html = re.sub(r'<div class="tick"[^>]*>.*?</div>\\s*</div>', '', html, flags=re.S)
              page.write_text(html, encoding="utf-8")
          PY
          # Flat article sources remain canonical; create clean URL folders from
          # the updated source pages after cache-busting their asset URLs.
          shopt -s nullglob
          for file in articles/*.html; do
            [ "${file##*/}" = "index.html" ] && continue
            slug="${file##*/}"
            slug="${slug%.html}"
            mkdir -p "$slug"
            cp "$file" "$slug/index.html"
          done
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
