name: Deploy Indian Anime Club to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Refresh shared article assets and build clean routes
        shell: bash
        run: |
          # Cache-bust shared assets on every deploy so browsers cannot keep an
          # older article shell after the canonical header/footer is updated.
          find . -type f -name '*.html' -not -path './.git/*' -print0 | while IFS= read -r -d '' file; do
            sed -i -E \
              -e "s#article\.css\?v=[^\"']+#article.css?v=${GITHUB_SHA}#g" \
              -e "s#article-enhancements\.js\?v=[^\"']+#article-enhancements.js?v=${GITHUB_SHA}#g" \
              "$file"
          done
          # Flat article sources remain canonical; create clean URL folders from
          # the updated source pages after cache-busting their asset URLs.
          shopt -s nullglob
          for file in articles/*.html; do
            [ "${file##*/}" = "index.html" ] && continue
            slug="${file##*/}"
            slug="${slug%.html}"
            mkdir -p "$slug"
            cp "$file" "$slug/index.html"
          done
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
