name: Deploy Indian Anime Club to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - name: Build clean article routes from flat source files
        shell: bash
        run: |
          # Keep article source files flat in articles/*.html, like Ninth Post.
          # GitHub Pages does not process .htaccess, so create route folders only
          # in the deployment artifact to preserve the site's existing clean URLs.
          shopt -s nullglob
          for file in articles/*.html; do
            [ "${file##*/}" = "index.html" ] && continue
            slug="${file##*/}"
            slug="${slug%.html}"
            mkdir -p "$slug"
            cp "$file" "$slug/index.html"
          done
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
