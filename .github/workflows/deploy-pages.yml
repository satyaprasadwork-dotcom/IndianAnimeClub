name: Deploy Indian Anime Club to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Refresh shared article assets and build clean routes
        shell: bash
        run: |
          # Cache-bust every HTML reference to shared assets with this deployment SHA.
          # Python is used so asset query strings are replaced literally and reliably.
          python3 - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          from html import escape as html_escape
          import os
          import re

          version = os.environ["GITHUB_SHA"]
          asset_ref = re.compile(
              r"""((?:href|src)=["'][^"']*(?:css/article\.css|site-shell\.css|article-enhancements\.js|site-shell\.js))(?:\?[^"']*)?(["'])""",
              re.IGNORECASE,
          )

          class ArticleHeadingParser(HTMLParser):
              VOID = {"area", "base", "br", "col", "embed", "hr", "img", "input", "link", "meta", "param", "source", "track", "wbr"}
              BLOCKED = {"quick-answer", "key-takeaways", "article-toc", "visual-explainer", "original-analysis", "sources", "related", "decision-framework"}
              EXCLUDED_TITLES = {
                  "in brief", "in this article", "on this page", "key takeaways",
                  "sources", "sources & further reading", "sources and further reading",
                  "further reading", "keep reading", "decision framework", "topic diagram",
              }

              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.stack = []
                  self.records = []
                  self.current = None

              def handle_starttag(self, tag, attrs):
                  tag = tag.lower()
                  attrs = dict(attrs)
                  if tag == "h2" and self.current is None:
                      ancestor_classes = [
                          set((entry_attrs.get("class") or "").split())
                          for _, entry_attrs in self.stack
                      ]
                      in_article = any(
                          entry_tag == "article" and "article" in set((entry_attrs.get("class") or "").split())
                          for entry_tag, entry_attrs in self.stack
                      )
                      in_body = any("body" in classes for classes in ancestor_classes)
                      blocked = any(classes & self.BLOCKED for classes in ancestor_classes)
                      self.current = {
                          "eligible": in_article and in_body and not blocked,
                          "id": attrs.get("id"),
                          "parts": [],
                      }
                  if tag not in self.VOID:
                      self.stack.append((tag, attrs))

              def handle_data(self, data):
                  if self.current is not None:
                      self.current["parts"].append(data)

              def handle_endtag(self, tag):
                  tag = tag.lower()
                  if tag == "h2" and self.current is not None:
                      record = self.current
                      record["title"] = " ".join("".join(record["parts"]).split())
                      title_key = record["title"].casefold()
                      if title_key in self.EXCLUDED_TITLES or not record["title"]:
                          record["eligible"] = False
                      self.records.append(record)
                      self.current = None
                  for index in range(len(self.stack) - 1, -1, -1):
                      if self.stack[index][0] == tag:
                          del self.stack[index:]
                          break

          def ensure_article_toc(document):
              if re.search(r"""<nav\b[^>]*class=["'][^"']*\barticle-toc\b""", document, re.I):
                  return document

              parser = ArticleHeadingParser()
              parser.feed(document)
              records = parser.records
              selected = [record for record in records if record["eligible"]]
              if not selected:
                  return document

              for number, record in enumerate(selected, 1):
                  record["toc_id"] = record["id"] or f"iac-article-section-{number}"

              # Give every selected heading its own anchor, even within long sections.
              record_index = [0]
              def add_heading_anchor(match):
                  index = record_index[0]
                  record_index[0] += 1
                  if index >= len(records):
                      return match.group(0)
                  record = records[index]
                  opening, contents, closing = match.group(1), match.group(2), match.group(3)
                  if record["eligible"] and not re.search(r"\bid\s*=", opening, re.I):
                      opening = opening[:-1] + ' id="' + html_escape(record["toc_id"], quote=True) + '">'
                  return opening + contents + closing

              document = re.sub(
                  r"""(<h2\b[^>]*>)([\s\S]*?)(</h2\s*>)""",
                  add_heading_anchor,
                  document,
                  flags=re.I,
              )

              items = "".join(
                  '<li><a href="#' + html_escape(record["toc_id"], quote=True) + '">' +
                  html_escape(record["title"]) + "</a></li>"
                  for record in selected
              )
              toc = (
                  '<nav class="article-toc" aria-label="Table of contents">'
                  '<div class="toc-heading"><span class="toc-kicker">ARTICLE GUIDE</span>'
                  '<h2>In this article</h2><span class="toc-count">' + str(len(selected)) +
                  ' sections</span></div><ol>' + items + '</ol></nav>'
              )

              for component in ("key-takeaways", "quick-answer"):
                  pattern = re.compile(
                      r"""(<section\b(?=[^>]*\bclass=["'][^"']*\b""" +
                      re.escape(component) + r"""\b[^"']*["'])[^>]*>[\s\S]*?</section\s*>)""",
                      re.I,
                  )
                  found = pattern.search(document)
                  if found:
                      return document[:found.end()] + toc + document[found.end():]
              body_open = re.search(
                  r"""<div\b(?=[^>]*\bclass=["'][^"']*\bbody\b[^"']*["'])[^>]*>""",
                  document,
                  re.I,
              )
              if body_open:
                  return document[:body_open.end()] + toc + document[body_open.end():]
              return document

          def ensure_article_reading_layout(document):
              # Put the approved layout into the generated HTML itself, not only
              # into a client-side DOM transformation. This keeps articles consistent
              # even before enhancement JavaScript runs.
              if re.search(r"""<div\b[^>]*class=["'][^"']*\barticle-reading-layout\b""", document, re.I):
                  return document

              body_open = re.search(
                  r"""<div\b(?=[^>]*\bclass=["'][^"']*\bbody\b[^"']*["'])[^>]*>""",
                  document,
                  re.I,
              )
              if not body_open:
                  return document

              # The article body is the final div directly inside the outer article.
              # Use the final </div></article> pair so nested explainer cards cannot
              # accidentally terminate the body extraction.
              endings = list(re.finditer(r"</div\s*>\s*</article\s*>", document[body_open.end():], re.I))
              if not endings:
                  return document
              body_end = body_open.end() + endings[-1].start()
              body_content = document[body_open.end():body_end]

              toc_matches = list(re.finditer(
                  r"""<nav\b(?=[^>]*\bclass=["'][^"']*\barticle-toc\b[^"']*["'])[^>]*>[\s\S]*?</nav\s*>""",
                  body_content,
                  re.I,
              ))
              if not toc_matches:
                  return document

              toc_match = toc_matches[0]
              toc = toc_match.group(0)
              # All article content stays in original order in the reading column;
              # only the TOC is lifted into the left sidebar.
              reading_content = body_content[:toc_match.start()] + body_content[toc_match.end():]
              wrapped = (
                  '<div class="article-reading-layout">'
                  '<aside class="article-sidebar" aria-label="Article table of contents">'
                  + toc +
                  '</aside><div class="article-prose">' + reading_content + '</div></div>'
              )
              return document[:body_open.end()] + wrapped + document[body_end:]

          for page in Path(".").rglob("*.html"):
              if ".git" in page.parts:
                  continue
              html = page.read_text(encoding="utf-8")
              html = asset_ref.sub(
                  lambda match: match.group(1) + "?v=" + version + match.group(2),
                  html,
              )

              # Make article assets deterministic at build time, rather than relying
              # only on a client-side stylesheet injection after the page has loaded.
              if page.parent.name == "articles" and page.name != "index.html":
                  # Remove the old inline rules that forced vivid legacy card colours.
                  html = re.sub(
                      r'<style\b(?=[^>]*\bid=["\']iac-article-card-fix["\'])[^>]*>[\s\S]*?</style\s*>',
                      "",
                      html,
                      count=1,
                      flags=re.I,
                  )

                  # Use a root-relative, deployment-versioned URL for the enhancer.
                  html = re.sub(
                      r'<script\b[^>]*\bsrc=["\'][^"\']*article-enhancements\.js(?:\?[^"\']*)?["\'][^>]*>\s*</script\s*>',
                      '<script src="/js/article-enhancements.js?v=' + version + '" defer></script>',
                      html,
                      count=1,
                      flags=re.I,
                  )

                  # Put the shared article redesign stylesheet in the HTML head.
                  # site-shell.js will reuse this link and keep its URL versioned.
                  if not re.search(
                      r'<link\b(?=[^>]*\bhref=["\']/site-shell\.css(?:\?[^"\']*)?["\'])',
                      html,
                      flags=re.I,
                  ):
                      html = re.sub(
                          r"</head\s*>",
                          '<link rel="stylesheet" href="/site-shell.css?v=' + version + '"></head>',
                          html,
                          count=1,
                          flags=re.I,
                      )

              # Article pages do not show the homepage news ticker.
              if page.parent.name == "articles" and page.name != "index.html":
                  html = re.sub(
                      r'<div class="tick"[^>]*>.*?</div>\s*</div>',
                      "",
                      html,
                      flags=re.S,
                  )

              # Every route receives the shared header and footer implementation.
              if not re.search(
                  r'<script\b[^>]*\bsrc=["\'][^"\']*site-shell\.js(?:\?[^"\']*)?["\']',
                  html,
                  flags=re.I,
              ):
                  html = re.sub(
                      r"</body\s*>",
                      '<script src="/site-shell.js?v=' + version + '" defer></script></body>',
                      html,
                      count=1,
                      flags=re.I,
                  )

              if page.parent.name == "articles" and page.name != "index.html":
                  html = ensure_article_toc(html)
                  html = ensure_article_reading_layout(html)

              page.write_text(html, encoding="utf-8")

          # Flat article sources remain canonical; create clean URL folders from
          # the cache-busted article HTML.
          for page in Path("articles").glob("*.html"):
              if page.name == "index.html":
                  continue
              target = Path(page.stem)
              target.mkdir(parents=True, exist_ok=True)
              (target / "index.html").write_text(page.read_text(encoding="utf-8"), encoding="utf-8")
          PY
      - name: Upload site
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy site
        id: deployment
        uses: actions/deploy-pages@v4
