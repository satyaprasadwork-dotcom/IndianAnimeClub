name: Indian Anime Club site audit

on:
  push:
    branches: [main, 'codex/**']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Enforce single approved public contact email
        run: python3 scripts/check_contact_emails.py
      - name: Verify consistent tracking in all committed HTML pages
        run: python3 scripts/ensure_tracking.py --check
      - name: Enforce shared header and footer in committed HTML sources
        run: python3 scripts/validate_shared_shell.py
      - name: Sync new article cards
        run: python3 scripts/sync_article_archive.py
      - name: Apply canonical shared logo, header and footer
        run: python3 scripts/sync_shared_shell.py
      - name: Validate shared markup and article header syntax
        run: python3 scripts/validate_shared_shell.py
      - name: Generate sitemap
        run: python3 scripts/generate_sitemap.py
      - name: Ensure consistent analytics, AdSense and Clarity tags
        run: python3 scripts/ensure_tracking.py
      - name: Verify canonical tracking remains exactly once
        run: python3 scripts/ensure_tracking.py --check
      - name: Generate transparent article claim-review register
        run: python3 scripts/review_articles.py
      - name: Validate visible and structured article modification dates
        run: python3 scripts/check_article_dates.py
      - name: Check article body counting and review invalidation
        run: python3 scripts/test_article_content.py
      - name: Upload editorial review register for editor validation
        uses: actions/upload-artifact@v4
        with:
          name: 27-article-editorial-claim-review
          path: |
            reports/editorial-review.md
            reports/claim-review.json
          retention-days: 60
      - name: Validate article SEO, images, sitemap and AdSense basics
        run: python3 scripts/audit_site.py
