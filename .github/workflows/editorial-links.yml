name: Weekly editorial source link review
on:
  push:
    branches: [main]
    paths:
      - 'articles/*.html'
      - 'scripts/check_external_links.py'
      - '.github/workflows/editorial-links.yml'
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check third-party editorial source links
        run: python3 scripts/check_external_links.py
      - name: Enumerate evidence and artwork needing manual clearance
        run: python3 scripts/build_source_and_artwork_register.py
      - name: Save report for manual claim/source review
        uses: actions/upload-artifact@v4
        with:
          name: editorial-source-link-report
          path: |
            link-check-report.json
            reports/source-verification-register.csv
            reports/artwork-rights-register.csv
          retention-days: 30
