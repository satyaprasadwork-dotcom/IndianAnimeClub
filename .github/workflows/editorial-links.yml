name: Weekly editorial source link review
on:
  schedule:
    - cron: '30 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  links:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.x"
      - name: Check third-party editorial source links
        run: python3 scripts/check_external_links.py
      - name: Save report for manual claim/source review
        uses: actions/upload-artifact@v4
        with:
          name: editorial-source-link-report
          path: link-check-report.json
          retention-days: 30
